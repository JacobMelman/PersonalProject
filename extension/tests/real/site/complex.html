<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Complex rendering fixture</title>
<style>
body{font:14px system-ui;margin:12px;background:#fff} .row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
canvas{border:1px solid #888} iframe{border:1px solid #888} #grid{height:160px;width:360px;overflow:auto;border:1px solid #888;position:relative}
#grid .r{position:absolute;left:0;right:0;height:20px;border-bottom:1px solid #eee;padding:0 6px;white-space:nowrap} #ticker{font:700 20px monospace}
</style></head><body>
<h2 id="h">Complex rendering fixture</h2>
<div class="row">
  <div><div>WebGL</div><canvas id="gl" width="300" height="160"></canvas></div>
  <div><div>2D canvas chart</div><canvas id="chart" width="300" height="160"></canvas></div>
  <div><div>Same-origin iframe</div><iframe id="same" src="/inner.html?c=orange" width="260" height="140"></iframe></div>
  <div><div>Cross-origin iframe</div><iframe id="cross" width="260" height="140"></iframe></div>
</div>
<div class="row" style="margin-top:10px">
  <div><div>Virtualized grid (200 000 rows)</div><div id="grid"><div id="sizer"></div></div></div>
  <div><div>Shadow DOM component</div><div id="host"></div></div>
  <div><div>High-frequency SPA updates</div><div id="ticker">0</div><div id="clicks">clicks: 0</div></div>
</div>
<script>
// WebGL: clear colour teal + a spinning yellow quad
try {
const gl = document.getElementById('gl').getContext('webgl');
const vs = gl.createShader(gl.VERTEX_SHADER); gl.shaderSource(vs, 'attribute vec2 p; uniform float a; void main(){ float c=cos(a), s=sin(a); gl_Position=vec4(c*p.x-s*p.y, s*p.x+c*p.y, 0., 1.); }'); gl.compileShader(vs);
const fs = gl.createShader(gl.FRAGMENT_SHADER); gl.shaderSource(fs, 'precision mediump float; void main(){ gl_FragColor=vec4(1.,1.,0.,1.); }'); gl.compileShader(fs);
const pr = gl.createProgram(); gl.attachShader(pr, vs); gl.attachShader(pr, fs); gl.linkProgram(pr); gl.useProgram(pr);
const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-.5,-.5, .5,-.5, -.5,.5, .5,.5]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(pr, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
const ua = gl.getUniformLocation(pr, 'a'); let a = 0;
(function g(){ a += 0.03; gl.clearColor(0, .78, .78, 1); gl.clear(gl.COLOR_BUFFER_BIT); gl.uniform1f(ua, a); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4); requestAnimationFrame(g); })();
} catch (e) { document.getElementById('h').textContent += ' (WebGL unavailable: ' + e.message + ')'; }
// 2D chart: green bars
const cc = document.getElementById('chart').getContext('2d'); let t = 0;
(function c(){ t++; cc.fillStyle = '#fff'; cc.fillRect(0,0,300,160); cc.fillStyle = 'rgb(0,170,0)'; for (let i=0;i<8;i++) cc.fillRect(10+i*35, 150-(20+Math.abs(Math.sin((t+i*9)/20))*110), 25, 20+Math.abs(Math.sin((t+i*9)/20))*110); requestAnimationFrame(c); })();
// cross-origin iframe on the second port
document.getElementById('cross').src = location.protocol + '//' + location.hostname + ':' + (Number(location.port) + 1) + '/inner.html?c=purple';
// virtualized grid
const grid = document.getElementById('grid'), N = 200000, H = 20; document.getElementById('sizer').style.height = N * H + 'px';
function paint(){ const top = Math.floor(grid.scrollTop / H); [...grid.querySelectorAll('.r')].forEach(e => e.remove()); for (let i = top; i < top + 9; i++) { const d = document.createElement('div'); d.className = 'r'; d.style.top = i * H + 'px'; d.textContent = 'Row ' + i + ' - Order #' + (1000000 + i) + ' - Customer ' + i; d.setAttribute('role', 'row'); grid.appendChild(d); } }
grid.addEventListener('scroll', paint); paint();
// shadow DOM
const host = document.getElementById('host'), root = host.attachShadow({ mode: 'open' });
root.innerHTML = '<button id="sb" style="padding:10px 18px">Shadow action</button>';
root.getElementById('sb').addEventListener('click', () => { document.getElementById('clicks').textContent = 'clicks: ' + (++window.__c || (window.__c = 1)); });
// high-frequency updates
let n = 0; setInterval(() => { document.getElementById('ticker').textContent = String(++n); }, 40);
</script></body></html>
